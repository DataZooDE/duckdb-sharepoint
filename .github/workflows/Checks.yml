# Fast per-PR checks that need no DuckDB platform matrix: credential hygiene
# and (once the duckdb submodule is pinned) the Catch2 pure-logic tests.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hygiene:
    name: Credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials committed
        run: ./scripts/check_no_credentials.sh

  unit-tests:
    name: Catch2 pure-logic tests
    runs-on: ubuntu-latest
    steps:
      # No submodules and nothing to install: the pure layer builds standalone
      # (test/cpp/CMakeLists.txt) needing only Catch2 -- no DuckDB, no OpenSSL,
      # no vcpkg. Catch2 comes from the system if present, else FetchContent, so
      # this stays a seconds-long gate instead of a full platform-matrix build.
      - uses: actions/checkout@v4
      - name: Build + run the pure-logic tests
        run: |
          cmake -S test/cpp -B build/unit
          cmake --build build/unit -j
          ./build/unit/sharepoint_unit_tests --reporter console::out=-
